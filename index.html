<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Page Not Available</title>

  <style>
    :root {
      --dark: #212121;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--white);
      color: var(--dark);
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .container {
      width: min(620px, 100%);
      text-align: center;
    }

    .icon {
      width: 86px;
      height: 86px;
      margin: 0 auto 30px;
      border: 3px solid var(--dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      font-weight: 700;
      line-height: 1;
    }

    h1 {
      font-size: clamp(38px, 6vw, 64px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }

    .status {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--dark);
      color: var(--white);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .description {
      max-width: 520px;
      margin: 0 auto;
      font-size: 18px;
      line-height: 1.65;
      color: var(--dark);
    }

    .divider {
      width: 52px;
      height: 3px;
      background: var(--dark);
      margin: 30px auto;
    }

    .code {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 24px 18px;
      }

      .icon {
        width: 72px;
        height: 72px;
        font-size: 36px;
        margin-bottom: 24px;
      }

      h1 {
        letter-spacing: -1px;
      }

      .description {
        font-size: 16px;
        line-height: 1.55;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="container">

      <div class="icon" aria-hidden="true">!</div>

      <h1>Page Not Available</h1>

      <div class="status">404 · Not Found</div>

      <p class="description">
        The page you're looking for is currently unavailable.
        It may have been moved, removed, or the URL may be incorrect.
      </p>

      <div class="divider"></div>

      <div class="code">Please check the URL and try again.</div>

    </section>
  </main>
</body>
</html>
